name: Build CSN Android APK 1.6.2
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Installer les outils Android 35
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Préparer exclusivement les sources CSN 1.6.2
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64,json,pathlib
          files=json.loads(base64.b64decode(''))
          root=pathlib.Path('csn16-build')
          for name,content in files.items():
              p=root/name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content,encoding='utf-8')
          PYTHON
      - name: Compiler CSN 1.6.2
        working-directory: csn16-build
        run: gradle --no-daemon :app:assembleDebug
      - name: Vérifier la version et nommer l’APK
        run: |
          APK=csn16-build/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee version.txt
          grep -q "versionName='1.6.2'" version.txt
          cp "$APK" CSN-1.6.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CSN-1.6.2-Android-APK
          path: CSN-1.6.2.apk
          if-no-files-found: error
