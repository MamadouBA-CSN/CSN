    - name: Verifier et extraire le paquet
      shell: bash
      run: "python3 - <<'PYCODE'\nfrom pathlib import Path\nimport base64, hashlib, io, os, zipfile\narchive_path\
        \ = Path(os.environ['RUNNER_TEMP']) / 'csn-package.b64'\ndata = base64.b64decode(archive_path.read_bytes())\n\
        assert hashlib.sha256(data).hexdigest() == '118cb87bd92e2536f32d2b707ff9095ff60f81149ead3475c40948c344096fbf',\
        \ 'Paquet corrompu'\nwith zipfile.ZipFile(io.BytesIO(data)) as archive:\n    archive.extractall('csn-release')\n\
        archive_path.unlink()\nPYCODE\n"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Installer les outils Android
      run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
    - name: Préparer bundletool
      run: curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
        --output "$RUNNER_TEMP/bundletool.jar"
    - name: Construire et valider
      shell: bash
      run: 'node tools/check-web.cjs

        export AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"

        export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"

        export BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar"

        python3 tools/build.py

        '
      working-directory: csn-release
    - name: Signer avec la clé de téléversement existante
      env:
        CSN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CSN_UPLOAD_KEYSTORE_BASE64 }}
        CSN_UPLOAD_STORE_PASSWORD: ${{ secrets.CSN_UPLOAD_STORE_PASSWORD }}
        CSN_UPLOAD_KEY_ALIAS: ${{ secrets.CSN_UPLOAD_KEY_ALIAS }}
        CSN_UPLOAD_KEY_PASSWORD: ${{ secrets.CSN_UPLOAD_KEY_PASSWORD || secrets.CSN_UPLOAD_STORE_PASSWORD }}
      shell: bash
      run: "set -euo pipefail\numask 077\nsign_dir=\"$(mktemp -d \"$RUNNER_TEMP/csn-signing.XXXXXX\")\"\ntrap 'rm\
        \ -rf \"$sign_dir\"' EXIT\nprintf '%s' \"$CSN_UPLOAD_KEYSTORE_BASE64\" | tr -d '[:space:]' | base64 --decode\
        \ > \"$sign_dir/upload.keystore\"\ncat > \"$sign_dir/InspectKey.java\" <<'JAVA'\nimport java.nio.file.*;\n\
        import java.security.*;\nimport java.util.*;\npublic class InspectKey {\n  public static void main(String[]\
        \ args) throws Exception {\n    try {\n      char[] storePassword=System.getenv(\"CSN_UPLOAD_STORE_PASSWORD\"\
        ).toCharArray();\n      char[] keyPassword=System.getenv(\"CSN_UPLOAD_KEY_PASSWORD\").toCharArray();\n \
        \     KeyStore ks=KeyStore.getInstance(new java.io.File(args[0]), storePassword);\n      String alias=System.getenv(\"\
        CSN_UPLOAD_KEY_ALIAS\");\n      if(alias==null || alias.isBlank()) {\n        List<String> keys=new ArrayList<>();\n\
        \        for (Enumeration<String> e=ks.aliases(); e.hasMoreElements();) {\n          String a=e.nextElement();\n\
        \          if(ks.entryInstanceOf(a,KeyStore.PrivateKeyEntry.class)) keys.add(a);\n        }\n        if(keys.size()!=1)\
        \ throw new Exception();\n        alias=keys.get(0);\n      }\n      if (!(ks.getKey(alias,keyPassword)\
        \ instanceof PrivateKey)) throw new Exception();\n      if(alias.contains(\"\\n\") || alias.contains(\"\\\
        r\")) throw new Exception();\n      Files.writeString(Path.of(args[1]),alias);\n      Arrays.fill(storePassword,'\\\
        0'); Arrays.fill(keyPassword,'\\0');\n      System.out.println(\"Cle privee et mot de passe verifies.\"\
        );\n    } catch(Exception e) {\n      System.err.println(\"Signature bloquee : verifier le mot de passe\
        \ du keystore, celui de la cle ou la presence de plusieurs cles privees.\");\n      System.exit(1);\n  \
        \  }\n  }\n}\nJAVA\njava \"$sign_dir/InspectKey.java\" \"$sign_dir/upload.keystore\" \"$sign_dir/alias\"\
        \nCSN_UPLOAD_KEY_ALIAS=\"$(cat \"$sign_dir/alias\")\"\nmask_alias=\"${CSN_UPLOAD_KEY_ALIAS//'%'/'%25'}\"\
        \nprintf '::add-mask::%s\\n' \"$mask_alias\"\ncp build/CSN-1.6.3-MISE-A-JOUR-NON-SIGNE.aab build/CSN-1.6.3-MISE-A-JOUR-SIGNE.aab\n\
        jarsigner -keystore \"$sign_dir/upload.keystore\" -storepass:env CSN_UPLOAD_STORE_PASSWORD -keypass:env\
        \ CSN_UPLOAD_KEY_PASSWORD build/CSN-1.6.3-MISE-A-JOUR-SIGNE.aab \"$CSN_UPLOAD_KEY_ALIAS\"\nLC_ALL=C jarsigner\
        \ -verify -verbose -certs build/CSN-1.6.3-MISE-A-JOUR-SIGNE.aab > \"$sign_dir/verification.txt\"\ngrep -F\
        \ 'jar verified.' \"$sign_dir/verification.txt\"\nkeytool -printcert -jarfile build/CSN-1.6.3-MISE-A-JOUR-SIGNE.aab\n\
        java -jar \"$RUNNER_TEMP/bundletool.jar\" validate --bundle=build/CSN-1.6.3-MISE-A-JOUR-SIGNE.aab\n"
      working-directory: csn-release
    - uses: actions/upload-artifact@v4
      with:
        name: CSN-1.6.3-MISE-A-JOUR-SIGNE
        path: csn-release/build/CSN-1.6.3-MISE-A-JOUR-SIGNE.aab
        if-no-files-found: error
    timeout-minutes: 25
'on':
  workflow_dispatch: null
