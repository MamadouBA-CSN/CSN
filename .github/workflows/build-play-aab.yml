name: Build CSN Play AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      -  uses: android-actions/setup-android@v4
      - name: Installer le SDK Android 36
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Préparer la signature de publication si configurée
        env:
          CSN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CSN_UPLOAD_KEYSTORE_BASE64 }}
          CSN_UPLOAD_STORE_PASSWORD: ${{ secrets.CSN_UPLOAD_STORE_PASSWORD }}
          CSN_UPLOAD_KEY_ALIAS: ${{ secrets.CSN_UPLOAD_KEY_ALIAS }}
          CSN_UPLOAD_KEY_PASSWORD: ${{ secrets.CSN_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$CSN_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$CSN_UPLOAD_STORE_PASSWORD" ] && [ -n "$CSN_UPLOAD_KEY_ALIAS" ] && [ -n "$CSN_UPLOAD_KEY_PASSWORD" ]; then
            echo "$CSN_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/csn-upload-key.jks"
            echo "CSN_UPLOAD_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/csn-upload-key.jks" >> "$GITHUB_ENV"
            echo "CSN_RELEASE_SIGNING=ready" >> "$GITHUB_ENV"
          else
            echo "CSN_RELEASE_SIGNING=not-configured" >> "$GITHUB_ENV"
            echo "::warning::L’AAB sera non signé et ne pourra pas être envoyé à Google Play."
          fi
      - name: Construire l’Android App Bundle
        env:
          CSN_UPLOAD_STORE_PASSWORD: ${{ secrets.CSN_UPLOAD_STORE_PASSWORD }}
          CSN_UPLOAD_KEY_ALIAS: ${{ secrets.CSN_UPLOAD_KEY_ALIAS }}
          CSN_UPLOAD_KEY_PASSWORD: ${{ secrets.CSN_UPLOAD_KEY_PASSWORD }}
        run: gradle bundleRelease
      - name: Publier l’artefact de compilation
        uses: actions/upload-artifact@v4
        with:
          name: CSN-1.6.2-Play-AAB-candidate
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
