name: Build CSN Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Extraire les sources
        shell: bash
        run: |
          unzip -o CSN-1.6.2-Play-AAB-API36-corrige.zip 'app/*' build.gradle settings.gradle

      - name: Preparer la version 1.6.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          chemin = Path("app/build.gradle")
          contenu = chemin.read_text()
          contenu, codes = re.subn(
              r"(?m)^(\s*)versionCode\s+.*$",
              r"\g<1>versionCode 19",
              contenu
          )
          contenu, noms = re.subn(
              r"(?m)^(\s*)versionName\s+.*$",
              r'\g<1>versionName "1.6.3"',
              contenu
          )
          if codes != 1 or noms != 1:
              raise SystemExit("Version introuvable ou presente plusieurs fois.")
          chemin.write_text(contenu)
          PY

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android
        uses: android-actions/setup-android@v4

      - name: Installer le SDK Android 36
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Construire le fichier AAB
        run: gradle --no-daemon :app:bundleRelease

      - name: Conserver le fichier AAB
        uses: actions/upload-artifact@v4
        with:
          name: CSN-1.6.3-AAB-travail
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
