            echo "CSN_RELEASE_SIGNING=ready" >> "$GITHUB_ENV"
          else
            echo "CSN_RELEASE_SIGNING=not-configured" >> "$GITHUB_ENV"
            echo "::warning::L’AAB sera non signé et ne pourra pas être envoyé à Google Play."
          fi
      - name: Construire l’Android App Bundle
        env:
          CSN_UPLOAD_STORE_PASSWORD: ${{ secrets.CSN_UPLOAD_STORE_PASSWORD }}
          CSN_UPLOAD_KEY_ALIAS: ${{ secrets.CSN_UPLOAD_KEY_ALIAS }}
          CSN_UPLOAD_KEY_PASSWORD: ${{ secrets.CSN_UPLOAD_KEY_PASSWORD }}
        run: gradle bundleRelease
      - name: Publier l’artefact de compilation
        uses: actions/upload-artifact@v4
        with:
          name: CSN-1.6.2-Play-AAB-candidate
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
