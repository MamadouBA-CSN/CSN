


name: Build CSN Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Decompresser CSN
        run: unzip -q CSN-ANDROID-1.3-SOURCE.zip -d CSN-ANDROID-1.3

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Construire APK
        working-directory: CSN-ANDROID-1.3
        run: gradle :app:assembleDebug --stacktrace

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: CSN-1.3-AUTO-Android-APK
          path: CSN-ANDROID-1.3/app/build/outputs/apk/debug/app-debug.apk
